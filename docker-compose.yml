version: "3.8"

services:
  eval-agent:
    build: .
    container_name: eval-agent
    ports:
      - "8501:8501"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_API_BASE=${OPENAI_API_BASE:-https://api.deepseek.com}
      - OPENAI_MODEL_NAME=${OPENAI_MODEL_NAME:-deepseek-v4-flash}
    volumes:
      - ./outputs:/app/outputs
    restart: unless-stopped
