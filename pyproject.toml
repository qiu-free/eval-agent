[project]
name = "eval-agent"
version = "0.1.0"
description = "EvalAgent - 复杂指令下的多轮对话自动评测系统"
authors = []
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "openai>=1.0.0",
    "streamlit>=1.40.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.28.0",
    "jinja2>=3.1.0",
]

[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*"]
